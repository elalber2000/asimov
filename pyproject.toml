[project]
name = "asimov"
version = "0.1.0"
description = "Neuro-symbolic adversarially generated AI axioms"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-community>=0.4.1",
    "langchain-core>=1.4.0",
    "langchain-nvidia-ai-endpoints>=1.3.0",
    "langchain-openai>=1.2.1",
    "openai>=2.36.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "z3-solver==4.15.4.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
