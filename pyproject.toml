[project]
name = "asimov"
version = "0.1.0"
description = "Neuro-symbolic adversarially generated AI axioms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.1",
    "openai>=2.36.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "z3-solver>=4.16.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69", "uv"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true
